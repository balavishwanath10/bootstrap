<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="cvr.webp" width="40" height="40" class="me-2" alt="logo">
      CVR COLLEGE OF ENGINEERING
    </a>
  </div>
</nav>

<!-- Form Section -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow-sm">
        <div class="card-body">

          <h4 class="text-center mb-4">Student Registration Form</h4>

          <form>

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" maxlength="10" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select class="form-select">
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Branch</label>
                <input type="text" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control">
              </div>

              <div class="col-md-6">
                <label class="form-label">Upload Photo</label>
                <input type="file" class="form-control">
              </div>

              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="3"></textarea>
              </div>

              <div class="col-12 form-check">
                <input class="form-check-input" type="checkbox" required>
                <label class="form-check-label">
                  I agree to terms and conditions
                </label>
              </div>

              <div class="col-12 text-center">
                <button class="btn btn-primary px-4">Register</button>
              </div>

            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
