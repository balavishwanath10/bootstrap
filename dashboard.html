<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    body {
      background: #f5f7fb;
    }

    .stat-card {
      border: none;
      border-radius: 12px;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 600;
    }

    .table-card {
      border: none;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">
      Student Dashboard
    </a>
  </div>
</nav>

<!-- Stats Section -->
<div class="container my-4">
  <div class="row g-3">

    <div class="col-md-3 col-6">
      <div class="card stat-card shadow-sm p-3 text-center">
        <h6>Total Students</h6>
        <div class="stat-number text-primary">120</div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card stat-card shadow-sm p-3 text-center">
        <h6>Present</h6>
        <div class="stat-number text-success">100</div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card stat-card shadow-sm p-3 text-center">
        <h6>Absent</h6>
        <div class="stat-number text-danger">20</div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card stat-card shadow-sm p-3 text-center">
        <h6>Placements</h6>
        <div class="stat-number text-warning">45</div>
      </div>
    </div>

  </div>
</div>

<!-- Search -->
<div class="container mb-3">
  <input type="text" class="form-control" placeholder="Search student...">
</div>

<!-- Table -->
<div class="container">
  <div class="card table-card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Branch</th>
              <th>Attendance</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>101</td>
              <td>Vishwa</td>
              <td>CSE</td>
              <td><span class="badge bg-success">Present</span></td>
            </tr>

            <tr>
              <td>102</td>
              <td>Abhi</td>
              <td>ECE</td>
              <td><span class="badge bg-danger">Absent</span></td>
            </tr>

            <tr>
              <td>103</td>
              <td>Buvana</td>
              <td>IT</td>
              <td><span class="badge bg-success">Present</span></td>
            </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>
</div>

</body>
</html>
