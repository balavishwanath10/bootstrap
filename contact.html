<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
    }

    .contact-card {
      border: none;
      border-radius: 12px;
    }

    .map-box {
      background: #dee2e6;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: #555;
      font-weight: 500;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="cvr.webp" width="40" height="40" class="me-2" alt="logo">
      CVR COLLEGE OF ENGINEERING
    </a>
  </div>
</nav>

<!-- Alert -->
<div class="container mt-3">
  <div class="alert alert-info">
    We usually respond within 24 hours.
  </div>
</div>

<!-- Contact Section -->
<div class="container my-4">
  <div class="row g-4">

    <!-- Form -->
    <div class="col-md-6">
      <div class="card contact-card shadow-sm p-3">

        <h5 class="mb-3">Contact Form</h5>

        <form>
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" required>
          </div>

          <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
          </div>

          <div class="mb-2">
            <label class="form-label">Subject</label>
            <input type="text" class="form-control">
          </div>

          <div class="mb-2">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4"></textarea>
          </div>

          <button class="btn btn-primary w-100">Send Message</button>
        </form>

      </div>
    </div>

    <!-- Contact Info + Map -->
    <div class="col-md-6">

      <div class="card contact-card shadow-sm p-3 mb-3">
        <h5>Contact Details</h5>
        <p class="mb-1">📍 CVR College of Engineering</p>
        <p class="mb-1">📞 +91 9876543210</p>
        <p class="mb-0">📧 info@cvr.ac.in</p>
      </div>

      <div class="map-box">
        Google Map Placeholder
      </div>

    </div>

  </div>
</div>

</body>
</html>
